# Conda packages for the DeepSweep simulation pipeline. Versions are those of
# the env that produced the 2026oct corpus (deepsweep_simulator, conda 24.11).
# The three simulation/statistic tools are NOT conda packages here; setup_env.sh
# builds or fetches them at pinned commits (see TOOLS.md).
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9.23
  - numpy=2.0.2
  - pandas=2.3.1
  - scipy=1.13.1
  # build toolchain for cosi2 and hapbin
  - compilers=1.11.0
  - gcc=14.3.0
  - gxx=14.3.0
  - sysroot_linux-64=2.28
  - cmake=4.3.1
  - make=4.4.1
  - git=2.53.0
  - zlib=1.3.2
  - bzip2=1.0.8
  - xz=5.8.2
  - gsl=2.7
  - wget=1.25.0
  - unzip=6.0
